[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone_arc_sign_shop"
version = "1.0.3"
dependencies = []
authors = [
    { name = "DEVILENMO", email = "DEVILENMO@gmail.com" },
]
description = "Sign Shop plugin for ARC Core - Create player-run shops using signs."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "plugin", "shop", "economy", "sign"]

[project.urls]
Homepage = "https://github.com/ARC-Minecraft/EndstoneMC-ARC-Sign-Shop-Plugin"

[project.entry-points."endstone"]
arc_sign_shop = "endstone_arc_sign_shop:ARCSignShopPlugin"